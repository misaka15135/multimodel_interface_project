<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eye Control</title>
    <link rel="stylesheet" href="./popup.css">
  </head>
  <body>
    <!--
      浏览器工具栏弹窗：只作为入口使用。
      真实控制界面会打开成右下角小窗口 app.html，避免普通 popup 失焦后被 Chrome 关闭。
    -->
    <main class="popup">
      <h1>Eye Control</h1>
      <p>打开控制窗口后，保持它可见运行，再切回目标网页使用脸部方向控制。</p>
      <button id="openAppButton">打开控制窗口</button>
      <label class="toggle">
        <input id="enabledInput" type="checkbox">
        <span>启用网页控制</span>
      </label>
      <p id="statusText" class="status">准备就绪</p>
    </main>
    <script src="./popup.js"></script>
  </body>
</html>
